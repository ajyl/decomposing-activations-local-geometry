seed: 43

data:
  source: "toy_mixture"
  data_device: "cuda"
  model_device: "cuda"
  max_pairs: 2_000_000
  toy_mixture:
    num_samples: 2_000_000
    num_components: 12
    dq: 64
    dk: 64
    min_rank: 3
    max_rank: 8
    snr: 3.5

split:
  train_batch_size: 128
  val_frac: 0.1

knn:
  pool_frac: 0.2
  num_centroids: 20
  init_from_groundtruth_means: false  # set true to initialize MFA means from toy generator mu_q/mu_k
  extra_random_means: 0             # append N random means to the ground-truth means
  num_samples: 200_000
  proj_dim: 32
  metric: "euclidean"
  kmeans_iters: 50
  kmeans_restarts: 10
  tol: 0.0001
  refine_epochs: 25

mfa:
  rank: 10
  epochs: 20
  lr: 0.001
  grad_clip: null
  #lambda_nuc: 0.001
  lambda_nuc: 0.0
  tau_scheduler:
    type: "exp"      # "linear", "cosine", or "exp"
    tau_start: 1.0
    tau_end: 1.0
    warmup_steps: 1_000
    anneal_steps: null  # null => use all training steps after warmup

output:
  output_dir: "./runs"
  run_name: "qk_toy_example"
